name: Build Windows installer

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'build-config.cjs'
      - 'src/**'
      - 'scripts/**'
      - 'native/**'
      - 'build/**'
      - '.github/workflows/release-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release/dots-*' -Filter 'MiMo Dots Setup *.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
          "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "version=$((Get-Content package.json -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.checksum.outputs.version }}
          name: MiMo Dots ${{ steps.checksum.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.checksum.outputs.installer_path }}
            ${{ steps.checksum.outputs.installer_path }}.sha256
          fail_on_unmatched_files: true



